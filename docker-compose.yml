name: zephyr

services:
  gateway:
    build:
      context: apps/gateway
    env_file:
      - path: .env
        required: false
    environment:
      GATEWAY_PORT: '8080'
      DB_URL: sqlite:///data/gateway.db
    ports:
      - '${GATEWAY_PORT:-8080}:8080'
    volumes:
      - gateway_data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  gateway_data:
