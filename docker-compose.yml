name: zephyr

services:
  gateway:
    build:
      context: apps/gateway
    env_file:
      - path: .env
        required: false
    environment:
      GATEWAY_PORT: '8080'
    ports:
      - '${GATEWAY_PORT:-8080}:8080'
    volumes:
      - gateway_data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  nats:
    image: nats:2-alpine
    profiles: ['nats']
    command: ['-js', '-sd', '/data']
    ports:
      - '4222:4222'
    volumes:
      - nats_data:/data
    restart: unless-stopped

volumes:
  gateway_data:
  nats_data:
